<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1217"/>
      <stop offset="40%" stop-color="#6b1d26"/>
      <stop offset="75%" stop-color="#4a151b"/>
      <stop offset="100%" stop-color="#24080c"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffebaa" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="bokehFilter">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Deep Red & Maroon Background -->
  <rect width="800" height="1000" fill="url(#bg1)"/>
  <rect width="800" height="1000" fill="url(#lightGlow)"/>

  <!-- Decorative Warm Bokeh Lights -->
  <circle cx="150" cy="180" r="45" fill="#ffe082" opacity="0.35" filter="url(#bokehFilter)"/>
  <circle cx="280" cy="120" r="30" fill="#ffb74d" opacity="0.4" filter="url(#bokehFilter)"/>
  <circle cx="680" cy="220" r="55" fill="#ffd54f" opacity="0.3" filter="url(#bokehFilter)"/>
  <circle cx="720" cy="380" r="40" fill="#ffe082" opacity="0.35" filter="url(#bokehFilter)"/>
  <circle cx="100" cy="420" r="35" fill="#ffb300" opacity="0.25" filter="url(#bokehFilter)"/>
  <circle cx="620" cy="130" r="28" fill="#fff9c4" opacity="0.45" filter="url(#bokehFilter)"/>
  <circle cx="400" cy="260" r="60" fill="#ffe082" opacity="0.2" filter="url(#bokehFilter)"/>

  <!-- String Lights Garland -->
  <path d="M 50,80 Q 250,160 450,110 T 750,140" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,6" opacity="0.6"/>
  <path d="M 30,190 Q 220,270 420,230 T 770,250" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,6" opacity="0.5"/>

  <!-- Glowing bulbs -->
  <circle cx="120" cy="108" r="6" fill="#fffde7" filter="url(#blurFilter)"/>
  <circle cx="120" cy="108" r="3" fill="#ffffff"/>
  <circle cx="260" cy="155" r="7" fill="#fffde7" filter="url(#blurFilter)"/>
  <circle cx="260" cy="155" r="3.5" fill="#ffffff"/>
  <circle cx="430" cy="112" r="6" fill="#fffde7" filter="url(#blurFilter)"/>
  <circle cx="430" cy="112" r="3" fill="#ffffff"/>
  <circle cx="580" cy="120" r="7" fill="#fffde7" filter="url(#blurFilter)"/>
  <circle cx="580" cy="120" r="3.5" fill="#ffffff"/>
  <circle cx="700" cy="136" r="6" fill="#fffde7" filter="url(#blurFilter)"/>
  <circle cx="700" cy="136" r="3" fill="#ffffff"/>

  <!-- Elegant Traditional / Celebration Silhouette Centerpiece -->
  <g transform="translate(400, 560)">
    <!-- Decorative arch / backdrop -->
    <path d="M -220,250 C -220,-80 -140,-200 0,-200 C 140,-200 220,-80 220,250 Z" fill="#2d0b10" opacity="0.45" stroke="#d4af37" stroke-width="2" stroke-dasharray="8,6"/>
    
    <!-- Warm Traditional Aesthetic Motif -->
    <circle cx="0" cy="-60" r="90" fill="#d4af37" opacity="0.12"/>
    <circle cx="0" cy="-60" r="70" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

    <!-- Subtle Silhouette: Anu & Pari together in formal attire -->
    <!-- Pari silhouette (left) -->
    <path d="M -85,-110 C -85,-130 -60,-130 -60,-110 C -60,-85 -85,-85 -85,-110 Z" fill="#d8b288" opacity="0.85"/>
    <path d="M -115,-70 C -95,-85 -50,-85 -30,-70 C -25,-40 -20,80 -25,200 L -120,200 C -125,80 -120,-40 -115,-70 Z" fill="#2c2c34" opacity="0.9"/>
    
    <!-- Anu silhouette (right) in traditional saree/lehenga attire -->
    <path d="M 50,-115 C 50,-135 75,-135 75,-115 C 75,-90 50,-90 50,-115 Z" fill="#d8b288" opacity="0.85"/>
    <!-- Traditional dupatta / graceful drape -->
    <path d="M 25,-75 C 50,-90 90,-85 110,-70 C 125,-40 145,50 150,200 L 10,200 C 15,100 20,-30 25,-75 Z" fill="#842634" opacity="0.95"/>
    <path d="M 25,-70 Q 70,-40 110,-20 Q 95,80 135,180" fill="none" stroke="#ffd54f" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Overlay Frame & Scrapbook Corner Accents -->
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.2"/>

  <!-- Aesthetic Caption Label -->
  <rect x="180" y="850" width="440" height="70" rx="35" fill="#1f070b" fill-opacity="0.85" stroke="#d4af37" stroke-width="1"/>
  <text x="400" y="880" font-family="'Playfair Display', serif" font-size="20" fill="#fdfbf7" text-anchor="middle" font-weight="600" letter-spacing="1.5">
    A MEMORY WORTH KEEPING
  </text>
  <text x="400" y="904" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#e6ca85" text-anchor="middle" letter-spacing="2">
    ✨ ANU &amp; PARI • SPECIAL OCCASION
  </text>
</svg>
