<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="outdoorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ee"/>
      <stop offset="45%" stop-color="#faebd7"/>
      <stop offset="85%" stop-color="#e8ede1"/>
      <stop offset="100%" stop-color="#cfdcc5"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="75%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffe494" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Warm sunny background -->
  <rect width="800" height="1000" fill="url(#outdoorBg)"/>
  <rect width="800" height="1000" fill="url(#sunGlow)"/>

  <!-- Sun rays & soft lens flare -->
  <circle cx="680" cy="180" r="120" fill="#fff9c4" opacity="0.3" filter="url(#softBlur)"/>
  <circle cx="680" cy="180" r="50" fill="#ffffff" opacity="0.6" filter="url(#softBlur)"/>

  <!-- Botanical foliage background -->
  <g opacity="0.4" fill="#698260">
    <path d="M 0,700 Q 120,620 180,680 T 300,640 L 300,1000 L 0,1000 Z"/>
    <path d="M 500,660 Q 640,580 720,650 T 800,610 L 800,1000 L 500,1000 Z"/>
  </g>

  <!-- Delicate falling floral petals -->
  <g fill="#f2b5bc" opacity="0.75">
    <path d="M 160,180 C 170,165 190,175 185,190 C 180,205 155,195 160,180 Z"/>
    <path d="M 620,320 C 630,305 650,315 645,330 C 640,345 615,335 620,320 Z"/>
    <path d="M 230,410 C 240,395 260,405 255,420 C 250,435 225,425 230,410 Z"/>
    <path d="M 690,520 C 700,505 720,515 715,530 C 710,545 685,535 690,520 Z"/>
  </g>

  <!-- Central Silhouette: Anu outdoors in Floral Top and Denim Jeans -->
  <g transform="translate(400, 490)">
    <!-- Soft circular aura -->
    <circle cx="0" cy="0" r="230" fill="#ffffff" opacity="0.6"/>
    <circle cx="0" cy="0" r="230" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.45"/>

    <!-- Hair / Head -->
    <path d="M -30,-140 C -30,-190 30,-190 30,-140 C 35,-100 20,-80 0,-80 C -20,-80 -35,-100 -30,-140 Z" fill="#3a251b"/>
    <!-- Flowing hair strands -->
    <path d="M 15,-130 C 40,-100 45,-40 35,20 C 30,10 20,-40 10,-100 Z" fill="#2d1c15"/>

    <!-- Floral Top -->
    <!-- Base top (soft blush cream) -->
    <path d="M -50,-70 C -15,-80 15,-80 50,-70 C 65,-20 60,60 55,90 L -55,90 C -60,60 -65,-20 -50,-70 Z" fill="#fff1f2"/>
    <!-- Floral print accents on top -->
    <circle cx="-20" cy="-40" r="7" fill="#f48fb1" opacity="0.8"/>
    <circle cx="20" cy="-30" r="8" fill="#f06292" opacity="0.75"/>
    <circle cx="-10" cy="20" r="9" fill="#f48fb1" opacity="0.8"/>
    <circle cx="25" cy="40" r="7" fill="#ec407a" opacity="0.7"/>
    <circle cx="-35" cy="50" r="8" fill="#f06292" opacity="0.75"/>
    <!-- Leaves on floral print -->
    <ellipse cx="-12" cy="-42" rx="4" ry="2" fill="#81c784" transform="rotate(30 -12 -42)"/>
    <ellipse cx="28" cy="-32" rx="4" ry="2" fill="#81c784" transform="rotate(-40 28 -32)"/>
    <ellipse cx="-2" cy="18" rx="4" ry="2" fill="#81c784" transform="rotate(25 -2 18)"/>

    <!-- Denim Jeans -->
    <path d="M -55,90 C -20,88 20,88 55,90 L 45,280 L 8,280 L 0,140 L -8,280 L -45,280 Z" fill="#3d5a80"/>
    <!-- Denim seam details -->
    <line x1="0" y1="90" x2="0" y2="140" stroke="#c99e52" stroke-width="1.5" stroke-dasharray="2,2"/>
    <path d="M -35,115 C -20,130 -10,130 0,115" fill="none" stroke="#c99e52" stroke-width="1.2"/>
    <path d="M 35,115 C 20,130 10,130 0,115" fill="none" stroke="#c99e52" stroke-width="1.2"/>
  </g>

  <!-- Frame border -->
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.35"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#c48b71" stroke-width="0.75" opacity="0.2"/>

  <!-- Aesthetic Caption Label -->
  <rect x="180" y="850" width="440" height="70" rx="35" fill="#ffffff" fill-opacity="0.9" stroke="#d4af37" stroke-width="1"/>
  <text x="400" y="880" font-family="'Playfair Display', serif" font-size="20" fill="#2d2424" text-anchor="middle" font-weight="600" letter-spacing="1.5">
    JUST BEING ANU
  </text>
  <text x="400" y="904" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#8c6d58" text-anchor="middle" letter-spacing="2">
    🌸 HER LITTLE MOMENTS • SUNSHINE
  </text>
</svg>
